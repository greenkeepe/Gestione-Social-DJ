name: Svuota tutti i media (reset totale)

# Operazione DISTRUTTIVA e irreversibile: cancella ogni foto/video/Reel dal
# bucket Cloudflare R2 e svuota le code (media-library, reel-jobs,
# posts-queue) per ripartire completamente da zero. Va lanciato solo a mano,
# mai schedulato, e richiede di scrivere "CONFERMA" per evitare click
# accidentali. Lo storico di quanto è già stato pubblicato sui social
# (published-log.json) non viene toccato.
on:
  workflow_dispatch:
    inputs:
      conferma:
        description: 'Scrivi CONFERMA (maiuscolo) per procedere davvero'
        required: true

permissions:
  contents: write

jobs:
  svuota:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica conferma
        run: |
          if [ "${{ inputs.conferma }}" != "CONFERMA" ]; then
            echo "Conferma mancante o errata: nessuna cancellazione eseguita."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installa dipendenze
        run: npm install

      - name: Svuota R2 e le code
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
        run: npm run svuota-media

      - name: Commit e push dei dati aggiornati
        run: |
          git config user.name "gestione-social-dj-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(reset): svuota tutti i media, si riparte da zero [skip ci]"
            for i in 1 2 3 4 5; do
              git push && break
              echo "Push rifiutato (probabile scrittura concorrente su data/), riprovo dopo un rebase..."
              git pull --rebase origin "${GITHUB_REF_NAME}" || { echo "Rebase in conflitto reale, annullo per ripartire da uno stato pulito"; git rebase --abort 2>/dev/null || true; }
              sleep $((RANDOM % 5 + 1))
            done
          else
            echo "Nessuna modifica ai dati da salvare."
          fi
