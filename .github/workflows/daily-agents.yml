name: Ciclo giornaliero agenti (contenuti, lead, analytics, strategia)

on:
  schedule:
    # 06:00 Europe/Rome (CET=UTC+1 in inverno, CEST=UTC+2 in estate).
    # GitHub Actions usa sempre UTC: 05:00 UTC copre l'orario voluto per
    # buona parte dell'anno; in piena estate scatterà verso le 07:00 locali,
    # comunque prima della finestra di pubblicazione delle 12:30.
    - cron: "0 5 * * *"
  workflow_dispatch: {} # permette di lanciarlo manualmente da GitHub per test

permissions:
  contents: write

concurrency:
  group: gestione-social-dj-agents
  cancel-in-progress: false

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installa dipendenze
        run: npm install

      - name: Esegui Agente Master (Direttore)
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_BUSINESS_ACCOUNT_ID: ${{ secrets.META_IG_BUSINESS_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_PHOTOS_ALBUM_ID: ${{ secrets.GOOGLE_PHOTOS_ALBUM_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run master

      - name: Commit e push dei dati aggiornati
        run: |
          git config user.name "gestione-social-dj-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(agenti): aggiornamento dati giornaliero [skip ci]"
            git push
          else
            echo "Nessuna modifica ai dati da salvare."
          fi
