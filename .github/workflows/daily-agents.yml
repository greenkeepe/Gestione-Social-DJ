name: Ciclo giornaliero agenti (contenuti, lead, analytics, strategia)

on:
  schedule:
    # 06:00 Europe/Rome (CET=UTC+1 in inverno, CEST=UTC+2 in estate).
    # GitHub Actions usa sempre UTC: 05:00 UTC copre l'orario voluto per
    # buona parte dell'anno; in piena estate scatterà verso le 07:00 locali,
    # comunque prima della finestra di pubblicazione delle 12:30.
    - cron: "0 5 * * *"
  workflow_dispatch: # permette di lanciarlo manualmente da GitHub per test
    inputs:
      forza_resoconto:
        description: "Invia comunque il resoconto mattutino su Telegram (solo per test manuali)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gestione-social-dj-agents
  cancel-in-progress: false

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installa ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Installa dipendenze
        run: npm install

      - name: Esegui Agente Master (Direttore)
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_BUSINESS_ACCOUNT_ID: ${{ secrets.META_IG_BUSINESS_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          # Il resoconto mattutino su Telegram parte SOLO dal vero ciclo
          # schedulato delle 06:00, mai da un lancio manuale/di test.
          MORNING_REPORT: ${{ github.event_name == 'schedule' || inputs.forza_resoconto == true }}
        run: npm run master

      - name: Commit e push dei dati aggiornati
        run: |
          git config user.name "gestione-social-dj-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(agenti): aggiornamento dati giornaliero [skip ci]"
            for i in 1 2 3 4 5; do
              git push && break
              echo "Push rifiutato (probabile scrittura concorrente su data/), riprovo dopo un rebase..."
              git pull --rebase origin "${GITHUB_REF_NAME}"
              sleep $((RANDOM % 5 + 1))
            done
          else
            echo "Nessuna modifica ai dati da salvare."
          fi
