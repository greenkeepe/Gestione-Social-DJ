name: Ciclo giornaliero agenti (contenuti, lead, analytics, strategia)

on:
  # Rete di sicurezza: un Vercel Cron Job (dashboard/vercel.json +
  # dashboard/app/api/cron/daily-agents) innesca questo stesso workflow via
  # workflow_dispatch all'orario preciso delle 08:00 Europe/Rome — ma solo se
  # la dashboard è online (può essere bloccata dal limite di build gratuite
  # di Vercel, visto dal vivo). Se il cron di Vercel salta un giorno, questo
  # schedule fa comunque partire il ciclo, anche se con qualche ora di
  # ritardo (limite noto di GitHub Actions sui repository con poca attività
  # continua). Se per caso scattano entrambi lo stesso giorno, il ciclo gira
  # due volte (innocuo: la pubblicazione ha già il suo limite di 1/giorno,
  # l'Esploratore dedupe da solo) — solo il resoconto Telegram viene evitato
  # la seconda volta, vedi il controllo in master-agent.ts.
  schedule:
    - cron: "0 6 * 4,5,6,7,8,9 *" # CEST (UTC+2, aprile-settembre) -> 08:00 locali
    - cron: "0 7 * 1,2,3,10,11,12 *" # CET (UTC+1, ottobre-marzo) -> 08:00 locali
  workflow_dispatch: # permette di lanciarlo manualmente da GitHub per test
    inputs:
      forza_resoconto:
        description: "Invia comunque il resoconto mattutino su Telegram (solo per test manuali)"
        type: boolean
        default: false
      forza_testimonianza:
        description: "Genera subito un post da una recensione, ignorando la probabilità casuale (solo per test manuali)"
        type: boolean
        default: false
      forza_nota:
        description: "Manda subito una proposta di Nota Instagram su Telegram, ignorando la probabilità casuale (solo per test manuali)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gestione-social-dj-agents
  cancel-in-progress: false

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installa ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Installa dipendenze
        run: npm install

      # actions/checkout blocca il codice al commit che esisteva nel momento
      # in cui QUESTO workflow è stato innescato, non a quello reale al
      # momento in cui parte davvero: se un'altra esecuzione (es. il Regista
      # che fa "fast-track" di questo stesso workflow subito dopo un suo
      # push) ha nel frattempo aggiornato data/, gli agenti qui sotto
      # leggerebbero dati già superati e il push finale fallirebbe. Ci si
      # allinea sempre all'ultimissima versione prima di far girare gli
      # agenti, invece di scoprirlo solo al momento del push.
      - name: Allinea con l'ultima versione del branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Esegui Agente Master (Direttore)
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_BUSINESS_ACCOUNT_ID: ${{ secrets.META_IG_BUSINESS_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          DASHBOARD_PUBLIC_URL: ${{ secrets.DASHBOARD_PUBLIC_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          # Il resoconto mattutino su Telegram parte SOLO dal vero ciclo
          # schedulato delle 06:00, mai da un lancio manuale/di test.
          MORNING_REPORT: ${{ github.event_name == 'schedule' || inputs.forza_resoconto == true }}
          FORCE_TESTIMONIANZA: ${{ inputs.forza_testimonianza }}
          FORCE_NOTA: ${{ inputs.forza_nota }}
        run: npm run master

      - name: Commit e push dei dati aggiornati
        run: |
          git config user.name "gestione-social-dj-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(agenti): aggiornamento dati giornaliero [skip ci]"
            for i in 1 2 3 4 5; do
              git push && break
              echo "Push rifiutato (probabile scrittura concorrente su data/), riprovo dopo un rebase..."
              git pull --rebase origin "${GITHUB_REF_NAME}"
              sleep $((RANDOM % 5 + 1))
            done
          else
            echo "Nessuna modifica ai dati da salvare."
          fi
