name: Controllo pubblicazione (trova l'orario migliore)

# Gira più volte al giorno e pubblica solo quando l'orologio raggiunge
# l'orario scelto dall'Agente Contenuti per il post del giorno (con una
# finestra di tolleranza di 90 minuti). Così la pubblicazione avviene
# sempre nella fascia storicamente più efficace, non a un orario fisso.
on:
  # Orari allineati alle 3 fasce di lib/bestTime.ts (12:30, 18:30 feriali;
  # 21:15 weekend) con 30-45 minuti di margine, dentro la finestra di
  # tolleranza di 90 minuti di publishing-agent.ts: un controllo troppo
  # presto o troppo tardi rispetto al target non pubblica mai (bug reale
  # trovato dal vivo — con "0 10,16,19,20 * * *" nessuno dei due orari
  # feriali cadeva mai in una finestra valida). Doppio cron per gestire
  # l'ora legale come in daily-agents.yml.
  schedule:
    - cron: "0 11,17,20 * 4,5,6,7,8,9 *" # CEST -> 13:00, 19:00, 22:00 locali
    - cron: "0 12,18,21 * 1,2,3,10,11,12 *" # CET -> 13:00, 19:00, 22:00 locali
  workflow_dispatch:
    inputs:
      forza_pubblicazione_id:
        description: "ID di un contenuto in coda da pubblicare SUBITO, ignorando limite giornaliero e orario (solo per test manuali)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: gestione-social-dj-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installa dipendenze
        run: npm install

      # Vedi lo stesso commento in daily-agents.yml: ci si allinea sempre
      # all'ultimissima versione del branch prima di pubblicare, così
      # l'Editore controlla lo stato vero (es. "già pubblicato oggi?") e
      # non uno superato da un'altra esecuzione nel frattempo.
      - name: Allinea con l'ultima versione del branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Esegui Agente Pubblicazione (Editore)
        env:
          TZ: Europe/Rome
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_BUSINESS_ACCOUNT_ID: ${{ secrets.META_IG_BUSINESS_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          FORCE_PUBLISH_QUEUE_ID: ${{ inputs.forza_pubblicazione_id }}
        run: npm run agent:publishing

      - name: Commit e push dei dati aggiornati
        run: |
          git config user.name "gestione-social-dj-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(editore): pubblicazione contenuto [skip ci]"
            for i in 1 2 3 4 5; do
              git push && break
              echo "Push rifiutato (probabile scrittura concorrente su data/), riprovo dopo un rebase..."
              git pull --rebase origin "${GITHUB_REF_NAME}" || { echo "Rebase in conflitto reale, annullo per ripartire da uno stato pulito"; git rebase --abort 2>/dev/null || true; }
              sleep $((RANDOM % 5 + 1))
            done
          else
            echo "Nessuna modifica ai dati da salvare."
          fi
