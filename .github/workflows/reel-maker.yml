name: AI Reel Maker (video grezzo -> Reel)

# Gira spesso durante il giorno per accorgersi in fretta di un nuovo video
# caricato dalla pagina "Crea Reel AI" della dashboard, senza bisogno di
# concedere alla dashboard il permesso di lanciare workflow (le basta poter
# scrivere su data/, come già fa per "Carica media"). Stesso schema di
# polling già usato da publish-check.yml.
on:
  schedule:
    - cron: "*/20 6-22 * * *" # ogni 20 minuti, 06:00-22:59 UTC (copre l'intera giornata italiana)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: gestione-social-dj-reelmaker
  cancel-in-progress: false

jobs:
  crea-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installa ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Installa dipendenze
        run: npm install

      - name: Esegui Agente Reel Maker (Regista)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          ENABLE_AI_REEL_MAKER: ${{ vars.ENABLE_AI_REEL_MAKER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
        run: npm run agent:reelmaker

      - name: Commit e push dei dati aggiornati
        id: commit
        run: |
          git config user.name "gestione-social-dj-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            # Un Reel ricevuto da Telegram viene promosso automaticamente a
            # media-library.json (vedi reel-maker-agent.ts): se questo file
            # cambia, c'è un nuovo contenuto pronto per la didascalia.
            if git diff --cached --name-only | grep -q "^data/media-library.json$"; then
              echo "promosso=true" >> "$GITHUB_OUTPUT"
            fi
            git commit -m "chore(regista): elaborazione AI Reel Maker [skip ci]"
            for i in 1 2 3 4 5; do
              git push && break
              echo "Push rifiutato (probabile scrittura concorrente su data/), riprovo dopo un rebase..."
              git pull --rebase origin "${GITHUB_REF_NAME}"
              sleep $((RANDOM % 5 + 1))
            done
          else
            echo "Nessuna modifica ai dati da salvare."
          fi

      - name: Fast-track del ciclo agenti (Reel da Telegram pronto per la didascalia)
        if: steps.commit.outputs.promosso == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run daily-agents.yml --ref "${GITHUB_REF_NAME}" \
            || echo "Fast-track non avviato (non bloccante): il ciclo giornaliero lo farà comunque più tardi."
